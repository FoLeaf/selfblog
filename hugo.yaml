baseURL: https://www.19y.cc/
locale: zh-cn
defaultContentLanguage: zh-cn
hasCJKLanguage: true

theme:
  - PaperMod

title: 19y的技术栈
copyright: "© 19y"

enableInlineShortcodes: true
enableRobotsTXT: true
enableEmoji: true
pygmentsUseClasses: true
buildDrafts: false
buildFuture: false
buildExpired: false

# PaperMod uses this section to decide which content appears on the home page.
mainsections:
  - post

pagination:
  pagerSize: 3

# Keep the existing public URLs stable during the theme migration.
permalinks:
  post: /p/:slug/
  page: /:slug/

taxonomies:
  category: categories
  tag: tags

# PaperMod's client-side search reads the home JSON output.
outputs:
  home:
    - HTML
    - RSS
    - JSON

params:
  env: production
  description: "19y 的技术博客，记录嵌入式、编程和学习笔记。"
  author: "19y"
  mainSections:
    - post

  defaultTheme: auto
  displayFullLangName: true
  ShowShareButtons: false
  ShowReadingTime: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowRssButtonInSectionTermList: true
  ShowAllPagesInArchive: true
  ShowPageNums: true
  ShowToc: true

  footer:
    text: "赣ICP备2025058913号-1"

  socialIcons:
    - name: github
      title: GitHub
      url: "https://github.com/FoLeaf/selfblog"

  assets:
    disableHLJS: true
    # Vercel 部署的 CSS/JS 与本地构建的行尾符不一致（git autocrlf），
    # 导致 SRI integrity 校验失败、浏览器拒绝加载样式。
    # 关闭指纹哈希后不再输出 integrity/crossorigin，避免此问题。
    disableFingerprinting: true
    favicon: favicon.svg
    favicon16x16: favicon-16x16.png
    favicon32x32: favicon-32x32.png
    apple_touch_icon: apple-touch-icon.png
    safari_pinned_tab: favicon.svg

  # Keep the existing math/front-matter switches available for future posts.
  math: false

related:
  includeNewer: true
  threshold: 60
  toLower: false
  indices:
    - name: tags
      weight: 100
    - name: categories
      weight: 200

markup:
  goldmark:
    extensions:
      passthrough:
        enable: true
        delimiters:
          block:
            - - '\['
              - '\]'
            - - '$$'
              - '$$'
          inline:
            - - '\('
              - '\)'
    renderer:
      unsafe: true
  tableOfContents:
    endLevel: 4
    ordered: true
    startLevel: 2
  highlight:
    noClasses: false
    codeFences: true
    guessSyntax: true
    lineNoStart: 1
    lineNos: true
    lineNumbersInTable: true
    tabWidth: 4

